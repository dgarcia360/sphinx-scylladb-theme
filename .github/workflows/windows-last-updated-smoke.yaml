name: "Windows / Last-updated smoke test"

# Verifies the doc2path separator fix on real Windows.
# Anna's repro: nested pages fall back to build date, only top-level works.
# Expected after the fix: every page shows the git date of its source file.

on:
  workflow_dispatch:
  push:
    branches:
      - test/windows-last-updated

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout (with full history)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Sync deps
        run: uv sync

      - name: Debug - show doc2path separator on this OS
        shell: pwsh
        run: |
          uv run python -c "import os, pathlib; print('os.sep=', repr(os.sep)); print('sample path=', repr(str(pathlib.Path('configuration') / 'index.rst')))"

      - name: Run unit tests
        run: uv run pytest tests/extensions/test_last_updated.py -v

      - name: Build docs (dirhtml)
        shell: pwsh
        working-directory: docs
        run: uv run sphinx-build -b dirhtml -d _build/doctrees source _build/dirhtml

      - name: Debug - check last-updated dates in built HTML
        shell: pwsh
        run: uv run python .github/scripts/check_last_updated.py
